mixed-port: 7890
allow-lan: false
mode: rule

external-controller: 127.0.0.1:9090
secret: '135987'
external-ui: /home/microvee/.config/mihomo/ui

proxy-providers:
  starlink:
    type: http
    url: "https://stov4.statab.de/scrb/061bf0fc942474e9300f7dfd4aeba13c"
    path: ./providers/starlink.yaml
    interval: 86400
  gougou:
    type: http
    url: "https://Fwe0yRXE.doggygosubs.com:8443/api/v1/client/d9cf27eabbd1077c47dcfa3049b78735"
    path: ./providers/gougou.yaml
    interval: 86400

proxy-groups:
  - name: STARLINK
    type: select
    use:
      - starlink

  - name: GOUGOU
    type: select
    use:
      - gougou

  - name: PROXY
    type: select
    proxies:
      - STARLINK
      - GOUGOU

rules:
  - MATCH,PROXY
